services:
  - type: web
    name: aksje-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: NEWSAPI_PLAN
        value: Developer
      - key: NEWSAPI_DAILY_BUDGET
        value: "60"
      - key: NEWSAPI_SHARED_CACHE_TTL_HOURS
        value: "12"
      - key: NEWSAPI_FALLBACK_ONLY
        value: "true"
      - key: REPORT_REVALIDATION_HOURS
        value: "6"
      - key: SEC_USER_AGENT
        sync: false
      - key: PUSHOVER_APP_TOKEN
        sync: false
      - key: PUSHOVER_USER_KEY
        sync: false
      - key: REPORT_PUBLIC_BASE_URL
        sync: false
      - key: REPORT_SCHEDULER_POLL_SECONDS
        value: "60"
      - key: PAPER_TRADING_ENABLED
        value: "true"
      - key: SCANNER_MAX_TICKERS
        value: "30"
      - key: SCAN_SLEEP_SECONDS
        value: "0.5"
  - type: cron
    name: aksje-app-report-scheduler
    runtime: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scheduled_runner.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: NEWSAPI_PLAN
        value: Developer
      - key: NEWSAPI_DAILY_BUDGET
        value: "60"
      - key: NEWSAPI_SHARED_CACHE_TTL_HOURS
        value: "12"
      - key: NEWSAPI_FALLBACK_ONLY
        value: "true"
      - key: REPORT_REVALIDATION_HOURS
        value: "6"
      - key: SEC_USER_AGENT
        sync: false
      - key: PUSHOVER_APP_TOKEN
        sync: false
      - key: PUSHOVER_USER_KEY
        sync: false
      - key: REPORT_PUBLIC_BASE_URL
        sync: false
      - key: PAPER_TRADING_ENABLED
        value: "true"
      - key: SCANNER_MAX_TICKERS
        value: "30"
      - key: SCAN_SLEEP_SECONDS
        value: "0.5"
