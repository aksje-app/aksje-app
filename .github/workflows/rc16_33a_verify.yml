name: rc16.33a verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest reportlab
      - name: Static release truth gates
        run: |
          python scripts/verify_autonomi_commitments.py
          python scripts/verify_rc16_33a_release.py
      - name: rc16.33a focused tests
        run: |
          pytest -q tests/test_autonomi_commitments_contract.py tests/test_rc16_33_quality_v11_v2_shadow.py tests/test_rc16_33a_quality_completion.py
