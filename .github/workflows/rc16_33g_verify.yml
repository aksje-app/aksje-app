name: rc16.33g verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip
          pip install pytest reportlab pypdf pandas
      - name: Release gates
        env: {PYTHONPATH: .}
        run: |
          python scripts/verify_autonomi_commitments.py
          python scripts/verify_rc16_33a_release.py
          python scripts/verify_rc16_33b_release.py
          python scripts/verify_rc16_33c_release.py
          python scripts/verify_rc16_33d_release.py
          python scripts/verify_rc16_33e_release.py
          python scripts/verify_rc16_33f_release.py
          python scripts/verify_rc16_33g_release.py
      - name: Focused regression tests
        env: {PYTHONPATH: .}
        run: |
          pytest -q tests/test_rc16_33b_mobile_quality_workflow.py tests/test_rc16_33c_report_package.py tests/test_rc16_33d_sector_quality_mobile_reports.py tests/test_rc16_33e_current_shadow_counts.py tests/test_rc16_33f_star_grade_sector_robustness.py tests/test_rc16_33g_quality_report_ux.py
