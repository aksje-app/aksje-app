name: Release gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: entry_exit_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d entry_exit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest PyYAML
      - name: Repository syntax
        run: |
          python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
      - name: Release contracts
        env:
          PYTHONPATH: .
        run: |
          python scripts/verify_autonomi_commitments.py
          python scripts/verify_rc16_33a_release.py
          python scripts/verify_rc16_33b_release.py
          python scripts/verify_rc16_33c_release.py
          python scripts/verify_rc16_33d_release.py
          python scripts/verify_rc16_33e_release.py
          python scripts/verify_rc16_33f_release.py
          python scripts/verify_rc16_33g_release.py
          python scripts/verify_rc16_33h_release.py
          python scripts/verify_rc16_33i_release.py
          python scripts/verify_rc16_33j_release.py
          python scripts/verify_rc16_33k_release.py
          python scripts/verify_rc16_33l_release.py
          python scripts/verify_rc16_33m_release.py
          python scripts/verify_rc16_33n_release.py
          python scripts/verify_rc16_33o_release.py
          python scripts/verify_rc16_33p_release.py
          python scripts/verify_rc16_33q_release.py
          python scripts/verify_rc16_34a_release.py
          python scripts/verify_rc16_34b_release.py
          python scripts/verify_rc16_34c_release.py
          python scripts/verify_rc16_34d_release.py
          python scripts/verify_rc16_34e_release.py
          python scripts/verify_rc16_34f_release.py
      - name: Superfond mobile and desktop browser layout
        env:
          SF_BROWSER_TEST: "1"
          PYTHONPATH: .
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          pytest -q tests/test_superfund_browser.py
      - name: Superfond browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Superfond-RC16.34p-browser
          path: dist/browser/
          if-no-files-found: ignore
      - name: Full application Paper download and navigation in browser
        env:
          SYSTEM_BROWSER_TEST: "1"
          PYTHONPATH: .
        run: pytest -q tests/test_system_revision_browser.py
      - name: Report sharing JavaScript
        env:
          PYTHONPATH: .
        run: node scripts/verify_report_share.mjs
      - name: Quality regression suite
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_system_revision_20261022.py \
            tests/test_mobile_pdf_return_link.py \
            tests/test_rc16_33d_sector_quality_mobile_reports.py \
            tests/test_rc16_33e_current_shadow_counts.py \
            tests/test_rc16_33f_star_grade_sector_robustness.py \
            tests/test_rc16_33g_quality_report_ux.py \
            tests/test_rc16_33h_quality_clarity_start_navigation.py \
            tests/test_rc16_33i_quality_navigation_consistency.py \
            tests/test_rc16_33j_quality_stabilization.py \
            tests/test_rc16_33k_v2_panel_semantics.py \
            tests/test_rc16_32r_capital_protection.py \
            tests/test_rc16_33l_profit_protection.py \
            tests/test_rc16_33m_paper_learning_recovery.py \
            tests/test_rc16_33n_exit_refill_counterfactual.py \
            tests/test_rc16_33o_mobile_navigation_recovery.py \
            tests/test_rc16_33p_super_portfolio_performance.py \
            tests/test_rc16_33q_super_portfolio_direct_route.py \
            tests/test_rc16_34a_production_readiness.py \
            tests/test_rc16_34b_super_portfolio_e2e.py \
            tests/test_rc16_34c_position_cap_reports.py \
            tests/test_rc16_34d_render_memory_rightsize.py \
            tests/test_rc16_34e_parameter_learning_ux.py \
            tests/test_rc16_34f_activation_history_memory.py \
            tests/test_program_audit_candidate_fallback.py \
            tests/test_program_audit_autonomy_accounting.py \
            tests/test_program_audit_learning_evidence.py \
            tests/test_program_audit_scheduler_truth.py \
            tests/test_market_event_discovery.py \
            tests/test_entry_exit_evidence.py \
            tests/test_mobile_approval_interactions.py \
            tests/test_portfolio_learning_validation.py \
            tests/test_learning_runtime.py \
            tests/test_superfund_v1.py \
            tests/test_superfund_event_risk.py \
            tests/test_superfund_presentation.py \
            tests/test_superfund_navigation_info.py \
            tests/test_work_progress_diagnostics.py \
            tests/test_rc16_31aa_snapshot_repository_memory.py \
            tests/test_rc16_31o_exit_policy.py \
            tests/test_market_policy_and_target_consistency.py \
            tests/test_full_market_quality_prescreen.py \
            tests/test_quality_valuation.py \
            tests/test_quality_turnaround.py \
            tests/test_rc16_32a_super_portfolio.py \
            tests/test_rc16_32b_super_portfolio_intelligence.py \
            tests/test_rc16_32c_super_portfolio_completion.py \
            tests/test_rc16_32d_super_portfolio_completion.py \
            tests/test_rc16_32e_super_portfolio_multimarket.py \
            tests/test_rc16_32f_super_portfolio_broad_discovery.py \
            tests/test_rc16_32g_super_portfolio_ui.py \
            tests/test_rc16_32h_super_portfolio_diagnostics.py \
            tests/test_rc16_32i_super_portfolio_decision_safety.py \
            tests/test_rc16_32j_super_portfolio_completion.py \
            tests/test_aurora_mobile_navigation_and_report_return.py \
            tests/test_v1915_mobile_navigation.py \
            tests/test_v19220_rc4_full_repairs.py
      - name: Active unversioned repository suite
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests \
            --ignore-glob='tests/test_rc*.py' \
            --ignore-glob='tests/test_v*.py'
      - name: PostgreSQL evidence round trips
        env:
          PYTHONPATH: .
          TEST_POSTGRES_URL: postgresql://test:test@localhost:5432/entry_exit_test
        run: pytest -q tests/test_entry_exit_postgres.py tests/test_superfund_postgres.py tests/test_quality_turnaround_postgres.py tests/test_revision_trade_postgres.py
      - name: Production-mode NOK lifecycle and PC/mobile exports on isolated PostgreSQL
        env:
          PYTHONPATH: .
          APP_ENVIRONMENT: test
          APP_RUNTIME_ROOT: /tmp/nok-production-gate
          DATABASE_URL: ""
          AUTH_DATABASE_URL: ""
          TEST_POSTGRES_URL: postgresql://test:test@localhost:5432/entry_exit_test
          SYSTEM_BROWSER_TEST: "1"
        run: pytest -q tests/test_production_restart.py tests/test_production_restart_browser.py tests/test_restart_trading.py tests/test_simulation_restart.py tests/test_restart_startup_guards.py tests/test_activation_preflight_integration.py tests/test_nok_operator_transport.py
      - name: Set traceable build identifier
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_ID=build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Build FULL and clean DELTA packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist delta_root
          git archive --format=zip --output=dist/AI_Aksje_Analyzer_${RELEASE_ID}_FULL.zip HEAD

          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then BASE_REF="main"; fi
          # Keep full history: a depth=1 fetch can destroy the merge base.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow origin
          fi
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git merge-base "origin/$BASE_REF" HEAD >/dev/null
          git diff --name-only "origin/$BASE_REF"...HEAD > dist/changed_files_all.txt

          grep -E '(\.py$|^render\.yaml$)' dist/changed_files_all.txt \
            | grep -vE '^(tests/|scripts/verify_|\.github/)' \
            > dist/changed_files_delta.txt || true

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            mkdir -p "delta_root/$(dirname "$file")"
            cp "$file" "delta_root/$file"
          done < dist/changed_files_delta.txt

          if [ ! -s dist/changed_files_delta.txt ]; then
            # A tests/docs-only PR is valid: ship an explicit no-code-change
            # marker rather than failing zip with "Nothing to do".
            printf '%s\n' 'No deployable Python or render.yaml files changed.' > delta_root/NO_DEPLOYABLE_CHANGES.txt
          fi
          (
            cd delta_root
            zip -qr ../dist/AI_Aksje_Analyzer_${RELEASE_ID}_DELTA.zip .
          )
          sha256sum dist/AI_Aksje_Analyzer_${RELEASE_ID}_FULL.zip \
                    dist/AI_Aksje_Analyzer_${RELEASE_ID}_DELTA.zip \
            > dist/SHA256SUMS_${RELEASE_ID}.txt

          echo "Clean DELTA files:"
          cat dist/changed_files_delta.txt
      - name: Summarise release candidate
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Release candidate: ${RELEASE_ID}"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Built FULL and DELTA artifacts. No deployment or trading-rule activation."
            echo "### Changed files"
            sed 's/^/- /' dist/changed_files_all.txt
            echo "### Checksums"
            cat "dist/SHA256SUMS_${RELEASE_ID}.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload FULL package
        uses: actions/upload-artifact@v4
        with:
          name: AI_Aksje_Analyzer_FULL_${{ github.run_number }}
          path: |
            dist/*_FULL.zip
            dist/SHA256SUMS_*.txt
          if-no-files-found: error
      - name: Upload clean DELTA package
        uses: actions/upload-artifact@v4
        with:
          name: AI_Aksje_Analyzer_DELTA_${{ github.run_number }}
          path: |
            dist/*_DELTA.zip
            dist/changed_files_delta.txt
            dist/SHA256SUMS_*.txt
          if-no-files-found: error
